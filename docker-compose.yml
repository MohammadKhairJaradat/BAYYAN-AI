services:
  postgres:
    image: postgres:17-alpine
    container_name: taxai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: GRADUATIONPROJECT2026
      POSTGRES_DB: jordanian_tax
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jordanian_tax"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    build:
      context: ./infra/minio
    image: bayyan-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: taxai-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
